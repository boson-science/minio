name: Release

# Releases are tagged the way upstream MinIO tags them:
#   RELEASE.<UTC time>                 e.g. RELEASE.2026-10-26T16-08-21Z
#   RELEASE.<UTC time>.hotfix.<commit> backport of fixes onto a release
# See RELEASING.md.
on:
  push:
    tags: ["RELEASE.*"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: downstream-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref_name, 'RELEASE.')
    # The public fork must not encode a private runner or network topology.
    # GitHub's hosted runner is sufficient; registry coordinates are
    # environment secrets and are never committed here.
    runs-on: ubuntu-24.04
    environment: downstream-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release and advisory gate
        shell: bash
        run: |
          set -euo pipefail
          re='^RELEASE\.([0-9]{4}-[0-9]{2}-[0-9]{2})T([0-9]{2})-([0-9]{2})-([0-9]{2})Z(\.hotfix\.[0-9a-f]{7,40})?$'
          [[ "$GITHUB_REF_NAME" =~ $re ]]
          # Fork releases must sort after upstream's final release tag.
          [[ "$GITHUB_REF_NAME" > "RELEASE.2025-10-15T17-29-55Z" ]]
          # Regular releases are cut from master; hotfixes from release/* branches.
          if [[ -z "${BASH_REMATCH[5]}" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          else
            git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/release/'
          fi
          test "$(jq '[.advisories[] | select(.status != "closed")] | length' security/advisory-matrix.json)" = 0
          go test ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Generate version ldflags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          re='^RELEASE\.([0-9]{4}-[0-9]{2}-[0-9]{2})T([0-9]{2})-([0-9]{2})-([0-9]{2})Z(\.(hotfix\.[0-9a-f]+))?$'
          [[ "$GITHUB_REF_NAME" =~ $re ]]
          version="${BASH_REMATCH[1]}T${BASH_REMATCH[2]}:${BASH_REMATCH[3]}:${BASH_REMATCH[4]}Z"
          ldflags="$(MINIO_RELEASE=RELEASE MINIO_HOTFIX="${BASH_REMATCH[6]}" go run buildscripts/gen-ldflags.go "$version")"
          # The binary must report exactly the tag being released.
          [[ "$ldflags" == *"cmd.ReleaseTag=$GITHUB_REF_NAME "* ]]
          echo "ldflags=$ldflags" >> "$GITHUB_OUTPUT"
      - name: Build immutable linux/amd64 image
        env:
          BUILD_BASE_DIGEST: ${{ vars.DOWNSTREAM_BUILD_BASE_DIGEST }}
          RUNTIME_BASE_DIGEST: ${{ vars.DOWNSTREAM_RUNTIME_BASE_DIGEST }}
          HARBOR_IMAGE: ${{ secrets.DOWNSTREAM_HARBOR_IMAGE }}
          HARBOR_REPOSITORY: ${{ vars.DOWNSTREAM_HARBOR_REPOSITORY }}
          HARBOR_USER: ${{ secrets.DOWNSTREAM_HARBOR_ROBOT_USER }}
          HARBOR_TOKEN: ${{ secrets.DOWNSTREAM_HARBOR_ROBOT_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LDFLAGS: ${{ steps.version.outputs.ldflags }}
        run: |
          set -euo pipefail
          test -n "$BUILD_BASE_DIGEST"; test -n "$RUNTIME_BASE_DIGEST"
          test -n "$HARBOR_IMAGE"; test -n "$HARBOR_REPOSITORY"
          harbor_host="${HARBOR_IMAGE%%/*}"
          echo "::add-mask::$harbor_host"
          printf '%s' "$HARBOR_TOKEN" | docker login "$harbor_host" -u "$HARBOR_USER" --password-stdin
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --pull=false \
            --build-arg BUILD_BASE="golang:1.24-alpine@$BUILD_BASE_DIGEST" \
            --build-arg RUNTIME_BASE="registry.access.redhat.com/ubi9/ubi-micro@$RUNTIME_BASE_DIGEST" \
            --build-arg RELEASE="$GITHUB_REF_NAME" \
            --build-arg LDFLAGS="$LDFLAGS" \
            --tag "$HARBOR_IMAGE:$GITHUB_REF_NAME" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME" \
            --push --provenance=true --sbom=true -f Dockerfile.downstream .
      - name: Resolve and sign immutable digest
        env:
          HARBOR_IMAGE: ${{ secrets.DOWNSTREAM_HARBOR_IMAGE }}
          HARBOR_REPOSITORY: ${{ vars.DOWNSTREAM_HARBOR_REPOSITORY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HARBOR_IMAGE"; test -n "$HARBOR_REPOSITORY"
          echo "::add-mask::${HARBOR_IMAGE%%/*}"
          ghcr_image="ghcr.io/$GITHUB_REPOSITORY"
          digest="$(docker buildx imagetools inspect "$HARBOR_IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          ghcr_digest="$(docker buildx imagetools inspect "$ghcr_image:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ghcr_digest" == "$digest" ]]
          cosign sign --yes "$HARBOR_IMAGE@$digest"
          cosign sign --yes "$ghcr_image@$digest"
          jq -n --arg tag "$GITHUB_REF_NAME" --arg digest "$digest" --arg ghcr_digest "$ghcr_digest" \
            --arg upstream "minio/minio@7aac2a2c" \
            --arg harbor_repository "$HARBOR_REPOSITORY" \
            '{release_tag:$tag,harbor_repository:$harbor_repository,harbor_tag:$tag,harbor_digest:$digest,ghcr_digest:$ghcr_digest,upstream_base_tag:$upstream,console_version:"v1.7.6",platforms:["linux/amd64"],workflow_identity:env.GITHUB_WORKFLOW_REF}' > release-manifest.json
          gh release create "$GITHUB_REF_NAME" release-manifest.json --verify-tag --generate-notes
