name: Shell formatting checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: runner / shfmt
    runs-on: tau-minio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Install shfmt
        run: GOBIN="$RUNNER_TEMP/bin" go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
      - name: Check shell formatting
        run: '"$RUNNER_TEMP/bin/shfmt" -s -d .'
