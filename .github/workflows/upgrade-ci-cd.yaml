name: Upgrade old version tests

on:
  workflow_dispatch:

# Keep one manual validation per selected ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build pinned test client
        uses: ./.github/actions/test-mc
      - name: Start upgrade tests
        run: |
          make test-upgrade
      - name: Preserve upgrade diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/minio-upgrade.*/compose.log
            ${{ runner.temp }}/minio-upgrade.*/heal.jsonl
            ${{ runner.temp }}/minio-upgrade.*/node-reads.log
          if-no-files-found: warn
          retention-days: 7
