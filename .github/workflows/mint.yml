name: Mint Tests

on:
  workflow_dispatch:

# Keep one manual validation per selected ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: cleanup #https://github.com/actions/checkout/issues/273
        run: |
          sudo -S rm -rf ${GITHUB_WORKSPACE}
          mkdir ${GITHUB_WORKSPACE}
      - name: checkout-step
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup-go-step
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.x

      - name: Build pinned test client
        uses: ./.github/actions/test-mc
      - name: github sha short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: build-minio
        run: |
          make build
          docker build -f Dockerfile.ci -t "quay.io/minio/minio:${{ steps.vars.outputs.sha_short }}" .

      - name: Build pinned historical multipart server
        run: |
          set -euo pipefail
          old_src="$RUNNER_TEMP/minio-multipart-2023"
          old_out="$RUNNER_TEMP/minio-multipart-image"
          git clone --quiet --depth 1 --branch RELEASE.2023-08-29T23-07-35Z https://github.com/minio/minio.git "$old_src"
          test "$(git -C "$old_src" rev-parse HEAD)" = 07b1281046c8934c47184d1b56c78995ef960f7d
          mkdir -p "$old_out"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$old_src:/src:ro" -v "$old_out:/out" -w /src \
            -e CGO_ENABLED=0 -e GOPATH=/tmp/gopath -e GOCACHE=/tmp/gocache \
            golang@sha256:8f9af7094d0cb27cc783c697ac5ba25efdc4da35f8526db21f7aebb0b0b4f18a \
            sh -ec 'flags=$(MINIO_RELEASE=RELEASE go run buildscripts/gen-ldflags.go 2023-08-29T23:07:35Z); go build -tags kqueue -trimpath -ldflags "$flags" -o /out/minio .'
          printf 'FROM quay.io/minio/minio:%s\nCOPY minio /usr/bin/minio\n' "${{ steps.vars.outputs.sha_short }}" > "$old_out/Dockerfile"
          docker build -t quay.io/minio/minio:RELEASE.2023-08-29T23-07-35Z "$old_out"

      - name: Prepare multipart test prerequisites
        run: |
          docker compose version
          printf '127.0.0.1 site1-nginx site2-nginx\n' | sudo tee -a /etc/hosts
          go build -o "$GITHUB_WORKSPACE/.github/workflows/multipart/s3-check-md5" ./docs/debugging/s3-check-md5

      - name: multipart uploads test
        timeout-minutes: 45
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/multipart/migrate.sh "${{ steps.vars.outputs.sha_short }}"

      - name: compress and encrypt
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "compress-encrypt" "minio" "minio123" "${{ steps.vars.outputs.sha_short }}"

      - name: multiple pools
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "pools" "minio" "minio123" "${{ steps.vars.outputs.sha_short }}"

      - name: standalone erasure
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "erasure" "minio" "minio123" "${{ steps.vars.outputs.sha_short }}"

      # FIXME: renable this back when we have a valid way to add deadlines for PUT()s (internode CreateFile)
      # - name: resiliency
      #   run: |
      #     ${GITHUB_WORKSPACE}/.github/workflows/run-mint.sh "resiliency" "minio" "minio123" "${{ steps.vars.outputs.sha_short }}"

      - name: The job must cleanup
        if: ${{ always() }}
        run: |
          export JOB_NAME=${{ steps.vars.outputs.sha_short }}
          for mode in $(echo compress-encrypt pools erasure); do
             docker compose -f ${GITHUB_WORKSPACE}/.github/workflows/mint/minio-${mode}.yaml down || true
             docker compose -f ${GITHUB_WORKSPACE}/.github/workflows/mint/minio-${mode}.yaml rm || true
          done

          docker compose -f ${GITHUB_WORKSPACE}/.github/workflows/multipart/docker-compose-site1.yaml rm -s -f || true
          docker compose -f ${GITHUB_WORKSPACE}/.github/workflows/multipart/docker-compose-site2.yaml rm -s -f || true
          for volume in $(docker volume ls -q | grep minio); do
            docker volume rm ${volume} || true
          done

          docker rmi -f quay.io/minio/minio:${{ steps.vars.outputs.sha_short }}
          docker system prune -f || true
          docker volume prune -f || true
          docker volume rm $(docker volume ls -q -f dangling=true) || true
