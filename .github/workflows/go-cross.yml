name: Crosscompile

on:
  workflow_dispatch:

# Keep one manual validation per selected ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Tests with Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      # Validate the release Dockerfile's stage arguments and other build checks.
      # The release job supplies its separately pinned base-image digests.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check downstream release Dockerfile
        run: |
          docker buildx build --check \
            --build-arg BUILD_BASE=golang:1.26.11-alpine \
            --build-arg RUNTIME_BASE=registry.access.redhat.com/ubi9/ubi-micro \
            -f Dockerfile.downstream .
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
          GO111MODULE: on
        run: |
          sudo sysctl net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl net.ipv6.conf.default.disable_ipv6=0
          make crosscompile
